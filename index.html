<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <!-- Font Awesome Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- Custom CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <main class="todo-app">

            <header class="todo-header">
                <h1>To-Do App
                    <span class="todo-icon"><i class="fa-solid fa-list"></i></span>
                </h1>
            </header>

            <p id="input-error" class="hidden"></p>

            <section class="todo-input-container">
                <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off"
                    aria-label="Add new task">
                <button id="add-btn">
                    <span class="add-text">Add</span>
                    <span class="add-icon">+</span>
                </button>
            </section>

            <nav class="filters">
                <button class="filter-btn active" data-filter="all">
                    <i class="fa-solid fa-list-ul"></i>All
                </button>
                <button class="filter-btn" data-filter="active">
                    <i class="fa-solid fa-circle"></i> Active
                </button>
                <button class="filter-btn" data-filter="completed">
                    <i class="fa-solid fa-check"></i> Completed
                </button>
            </nav>

            <section class="sort-search-container">
                <div class="sort-container">
                    <select class="sort-selectors">
                        <option value="" disabled>Choose to sort</option>
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                    </select>
                </div>

                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search todos..." autocomplete="off">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                </div>
            </section>

            <section class="todo-section">
                <ul class="todoList" id="todo-list"></ul>
            </section>

            <footer class="footer">
                <div class="todo-footer">
                    <div>
                        <span id="todo-completed"></span>
                        <span id="todo-notcompleted"></span>
                    </div>

                    <button id="clear-completed">Clear Completed</button>
                </div>

                <div class="clearAll">
                    <button id="clear-all">Clear All</button>
                </div>
            </footer>

        </main>
    </div>

    <script src="script.js"></script>


</body>

</html>
